# Updates an already-published release of The Disk King's own plugins when its folder release/<slug>/<version>/
# changes on main: uploads any new or changed zips (for example the separate Gen 1 / Gen 2 downloads), a fresh
# SHA256SUMS.txt, and the NOTES.md text. New releases are still made by release-own.yml when a tag is pushed.
# Uses only GitHub's built-in per-run pass (GITHUB_TOKEN) and the gh tool GitHub's runners already have.
name: Update own release
on:
  push:
    branches: [main]
    paths: ['release/**']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update the changed releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -e
          if git cat-file -e "$BEFORE" 2>/dev/null; then RANGE="$BEFORE..$GITHUB_SHA"; else RANGE="HEAD~1..HEAD"; fi
          git diff --name-only "$RANGE" -- release/ | awk -F/ 'NF>=4 {print $2"/"$3}' | sort -u > /tmp/dirs.txt
          cat /tmp/dirs.txt
          while IFS=/ read -r SLUG VER; do
            DIR="release/$SLUG/$VER"; TAG="$SLUG-v$VER"
            [ -f "$DIR/NOTES.md" ] || continue
            if ! gh release view "$TAG" > /dev/null 2>&1; then echo "no release $TAG yet: skipped"; continue; fi
            ( cd "$DIR" && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt )
            # Only zips the release does not have yet: re-uploading an existing one would reset its download count.
            gh release view "$TAG" --json assets -q '.assets[].name' > /tmp/have.txt
            for Z in "$DIR"/*.zip; do
              grep -qxF "$(basename "$Z")" /tmp/have.txt && echo "already there: $(basename "$Z")" || gh release upload "$TAG" "$Z"
            done
            gh release upload "$TAG" "$DIR/SHA256SUMS.txt" --clobber
            TITLE="$(head -n 1 "$DIR/NOTES.md")"
            tail -n +3 "$DIR/NOTES.md" > /tmp/notes.md
            gh release edit "$TAG" --title "$TITLE" --notes-file /tmp/notes.md
            echo "updated $TAG"
          done < /tmp/dirs.txt
