# Publishes plugins approved at thediskking.com/plugins/admin as releases of this repo, every hour.
# Uses GitHub's own per-run pass (GITHUB_TOKEN) and the publishing key saved as the secret COMMUNITY_FEED_KEY.
name: Publish approved uploads
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish approved uploads
        env:
          COMMUNITY_FEED_KEY: ${{ secrets.COMMUNITY_FEED_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u publish.py
      - name: Save screenshots, makers and tested records
        run: |
          if [ -f changed.flag ]; then
            rm changed.flag
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add community.json tested.json docs/screenshots
            git diff --cached --quiet || { git commit -q -m "Published approved uploads"; git push -q; }
          fi
